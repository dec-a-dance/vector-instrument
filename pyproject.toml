[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-cli"
version = "0.1.0"
description = "CLI utility for vector ingestion, storage, subjective vector management, and kNN search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pytest>=7.0"
]

[project.scripts]
vector-cli = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]